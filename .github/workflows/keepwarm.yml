# Keeps the Render free instance awake so visitors never hit the ~50s
# "starting application" cold start. Render spins a free service down after
# 15 minutes without traffic; this pings /api/health every 10 minutes.
#
# Public repo => GitHub Actions minutes are free. GitHub may delay scheduled
# runs by a few minutes under load, which is fine here.
name: keepwarm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          code=$(curl -sS -m 90 -o /dev/null -w '%{http_code}' https://veltrez.onrender.com/api/health || echo 000)
          echo "HTTP $code"
          test "$code" = "200"
